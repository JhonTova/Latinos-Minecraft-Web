# =============================================================================
# Integracion continua
# =============================================================================
#
# scripts/actualizar.sh despliega lo que haya en main. Este flujo es lo que
# impide que llegue a main un cambio que no compila o rompe una prueba: ejecuta
# lo mismo que se pide en AGENTS.md antes de dar un cambio por terminado.
#
# No usa secretos, asi que corre igual en cualquier pull request. Las acciones
# van fijadas por SHA (con la version en un comentario): una etiqueta como @v4
# la puede mover su autor, un SHA no.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# En un PR, un push nuevo deja obsoleta la ejecucion anterior y se cancela. En
# main no: cada commit que llega a produccion tiene que quedar con su resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Se decide aqui y no con 'paths:' en el disparador a proposito. Con 'paths:',
  # un PR que solo toca documentacion no ejecuta el flujo, y si los checks se
  # marcan como obligatorios en la proteccion de main, ese PR se queda esperando
  # un check que nunca llega. Un trabajo omitido, en cambio, cuenta como aprobado.
  cambios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # En un PR, paths-filter pide la lista de archivos a la API de GitHub, y eso
    # exige leer pull requests. Solo este trabajo lo necesita.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filtro.outputs.backend == 'true' || steps.filtro.outputs.flujo == 'true' }}
      frontend: ${{ steps.filtro.outputs.frontend == 'true' || steps.filtro.outputs.flujo == 'true' }}
      arnes: ${{ steps.filtro.outputs.arnes == 'true' || steps.filtro.outputs.flujo == 'true' }}
      criticos: ${{ steps.filtro.outputs.criticos == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filtro
        with:
          # 'every': un archivo cuenta solo si cumple TODOS los patrones del
          # filtro. Asi un cambio que solo toca Markdown (AGENTS.md, skills,
          # documentacion) no compila ni prueba nada.
          predicate-quantifier: every
          filters: |
            backend:
              - 'backend/**'
              - '!**/*.md'
            frontend:
              - 'frontend/**'
              - '!**/*.md'
            criticos:
              - 'backend/{identity,voting,trust,billing}/**'
              - '!**/*.md'
            arnes:
              - '.claude/hooks/**'
            flujo:
              - '.github/workflows/ci.yml'

  # Una migracion que ya esta en main ya se aplico en produccion, y Flyway
  # compara su checksum al arrancar: si alguien la edita, la aplicacion no
  # levanta tras el despliegue. Ninguna prueba lo detecta, porque ninguna usa una
  # base de datos real (ADR-0021). Este trabajo si: falla si el pull request
  # modifica, renombra o borra un archivo de db/migration que existe en main.
  # Agregar migraciones nuevas esta permitido.
  #
  # Corre siempre (es un git diff) para poder marcarlo como check obligatorio:
  # un trabajo que a veces no se ejecuta dejaria los pull requests esperando.
  migraciones:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Comprobar que las migraciones aplicadas siguen intactas
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: sh .github/scripts/migraciones-intactas.sh "$BASE"

  # Los hooks de .claude/hooks son los que impiden que un agente edite fuera de
  # su carpeta o ejecute un comando que no es de su rol. Si su politica se rompe,
  # los permisos de los agentes dejan de existir sin que nadie lo note: por eso
  # tienen pruebas y se ejecutan aqui. No necesitan instalar nada.
  arnes:
    needs: cambios
    if: needs.cambios.outputs.arnes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # La prueba de las migraciones pregunta a git si un archivo ya esta en
          # main; sin esa rama en el clon no podria responder.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Probar la politica de permisos de los agentes
        run: |
          git branch --force main origin/main 2>/dev/null || true
          node --test .claude/hooks/*.test.mjs

  backend:
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # La misma distribucion y version que backend/Dockerfile.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No se ejecuta spotless:check: el codigo actual no lo pasa
      # (ver backend/AGENTS.md) y pondria la CI en rojo desde el primer dia.
      # 'verify' tambien mide la cobertura con JaCoCo y falla si un modulo
      # critico baja de su suelo (ADR-0032).
      - name: Compilar y probar
        run: mvn -B -ntp verify

      - name: Resumir la cobertura
        if: always()
        run: sh ../.github/scripts/resumen-cobertura.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-jacoco
          path: backend/**/target/site/jacoco/
          retention-days: 14

      - name: Guardar los reportes de las pruebas
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes-surefire
          path: backend/**/target/surefire-reports/
          retention-days: 7

  # Mutacion con PIT, solo cuando el pull request toca un modulo critico
  # (ADR-0032). Es informativa: no hay umbral que la haga fallar, y no es un
  # check obligatorio. Deja el informe como artefacto para que quien revisa
  # clasifique los mutantes supervivientes de las clases que cambiaron.
  mutacion:
    needs: cambios
    if: needs.cambios.outputs.criticos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Mutar los modulos criticos
        run: mvn -B -ntp -Pmutacion -pl identity,voting,trust,billing -am verify

      - name: Guardar el informe de mutacion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutacion-pit
          path: backend/**/target/pit-reports/
          retention-days: 14

  frontend:
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # La misma version que frontend/Dockerfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar con ESLint
        run: npm run lint

      # Logica sin interfaz y la lista blanca del puente (ADR-0031).
      - name: Probar con Vitest
        run: npm run test

      # Tambien revisa los tipos de TypeScript.
      - name: Compilar
        run: npm run build
