p, Glob, Bash (npm) · sonnet</text><rect x='680' y='398' width='300' height='78' rx='8' fill='#eef6f0' stroke='#2e5e3e' stroke-width='1.3'/><text x='830.0' y='420.0' font-size='12.5' font-weight='bold' text-anchor='middle' fill='#12351f'>verificador-ui</text><text x='830.0' y='434.0' font-size='11' font-weight='normal' text-anchor='middle' fill='#1b1b1f'>Móvil/escritorio · claro/oscuro · estados · axe</text><text x='830.0' y='448.0' font-size='11' font-weight='normal' text-anchor='middle' fill='#1b1b1f'>Toca: nada · Read, Bash (npm run build/start),</text><text x='830.0' y='462.0' font-size='11' font-weight='normal' text-anchor='middle' fill='#1b1b1f'>mcp__playwright__* · Modelo: haiku</text><circle cx='971' cy='407' r='6.5' fill='#b5d334' stroke='#3c5a0a' stroke-width='1'/><rect x='10' y='506' width='980' height='86' rx='10' fill='#f4f4f6' stroke='#888'/><text x='24' y='526' font-size='12.5' font-weight='bold' text-anchor='start' fill='#333'>Fuera de los agentes · GitHub (el orquestador abre el PR; nadie hace push a main)</text><rect x='24' y='536' width='300' height='46' rx='8' fill='#f4f4f6' stroke='#888' stroke-width='1.3'/><text x='174.0' y='556.0' font-size='12.5' font-weight='bold' text-anchor='middle' fill='#12351f'>CI «calidad» (puerta que bloquea)</text><text x='174.0' y='569.5' font-size='10.5' font-weight='normal' text-anchor='middle' fill='#1b1b1f'>mvn -B verify · lint · build · vitest · migraciones intactas</text><circle cx='315' cy='545' r='6.5' fill='#b5d334' stroke='#3c5a0a' stroke-width='1'/><rect x='350' y='536' width='280' height='46' rx='8' fill='#f4f4f6' stroke='#888' stroke-width='1.3'/><text x='490.0' y='556.0' font-size='12.5' font-weight='bold' text-anchor='middle' fill='#12351f'>Claude Code Review</text><text x='490.0' y='569.5' font-size='10.5' font-weight='normal' text-anchor='middle' fill='#1b1b1f'>comentarios en el PR · no bloquea</text><rect x='656' y='536' width='320' height='46' rx='8' fill='#f4f4f6' stroke='#888' stroke-width='1.3'